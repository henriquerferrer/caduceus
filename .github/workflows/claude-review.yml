# Code generated by sweap (source sha256:a3656524b749). DO NOT EDIT.
# VENDORED BY SWEAP: kept in lockstep with the plugin copy on every session
# start (except /compact and /clear); local edits are overwritten.
name: Claude Review

# SWEAP-MANAGED. Independent reviewer on every PR (agentic-ci Plan B,
# hand-rolled). Skips gracefully until the CLAUDE_CODE_OAUTH_TOKEN repo secret
# exists (generate with `claude setup-token`, store with `gh secret set`).
#
# MANAGED SINCE 0.20.0. This file used to be COPY-IF-ABSENT, which meant a fix
# here reached only repos that did not yet have it — i.e. nobody who was
# actually running the reviewer. two consumers each carried a hand-edited
# variant that drifted for weeks, and when both hit the same no-verdict defect
# there was no single place to fix it. Customize through the seams below, never
# by editing this file: local edits are overwritten on the next session start.
#
#   RUNNER_LABELS          repo variable, JSON array of runner labels for this
#                          job. Default ["ubuntu-24.04"]. A self-hosted fleet
#                          that fences jobs by label needs BOTH labels, e.g.
#                          ["self-hosted","general"] — one label alone can put
#                          this 5-9 minute job on the e2e runner and hold it
#                          (a consumer, 2026-08-26: an e2e job started 4 seconds
#                          after this job released the runner).
#   CLAUDE_REVIEWER_LOGIN  repo variable; see the verdict gate below.
#   review.focus           a line in CLAUDE.md's `## sweap config` block naming
#                          the project-specific things the reviewer must look
#                          at, in that project's own vocabulary. This is where
#                          a repo puts what it used to hand-edit into the
#                          prompt below.
#
# Reviewer identity: with no `github_token` passed (this file passes none;
# `id-token: write` is the app-auth path) the action posts as `claude[bot]`,
# which is what the verdict gate below requires. A repo that connects a custom
# GitHub App (custom `github_token` / `bot_name`) must set the repo variable
# CLAUDE_REVIEWER_LOGIN to its own `<slug>[bot]`, or the verdict gate fails
# closed on every PR.
#
# ONE TURN, TWO PASSES (0.21.0). The first DIAGNOSED no-verdict run (a consumer
# #310, 2026-09-11, three runs on two heads, transcript in hand) ended like
# this: the reviewer met a large diff, dispatched three background review
# agents, called ScheduleWakeup "to wait for them", and ended its turn. Nothing
# re-invokes a process inside an Action, so the run exited success having
# posted nothing, and the gate below failed closed three times. Three controls
# now sit on that, in decreasing order of strength:
#   1. `--disallowedTools Agent,Task,ScheduleWakeup` in claude_args — the
#      tools are removed from the reviewer's tool set, so the mechanism cannot
#      fire whatever the model decides. (--allowedTools only AUTO-APPROVES;
#      it does not forbid anything, which is why the narrow list never helped.)
#   2. A guarded RETRY pass: if the first pass posts no verdict, a second
#      action step re-runs the same prompt with a preamble saying so. This is
#      the re-invocation the reviewer assumed it would get, and it also covers
#      the 2026-09-02 no-verdict runs that were never diagnosed. One retry,
#      never more; the first step is continue-on-error so a crashed first pass
#      can be rescued too. The gate prints a ::warning when the verdict came
#      from the retry, so a rescue is visible, never silent.
#   3. The prompt says it in words, for the model's benefit. This lives HERE,
#      in the managed prompt, so every consumer gets it; a consumer that
#      copied it into CLAUDE.md while waiting for this release can drop it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# READ, not write. The reviewer posts with the App token the action mints
# from id-token (every one of a consumer's 193 verdicts is authored by
# claude[bot], never by github-actions[bot]); our own run: steps only read.
# `actions: read` was granted for CI tools that are only wired through the
# action's additional_permissions input, which this file does not pass.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts skip. So does a PR from another repository: on a public repo the
    # secret is withheld from fork runs and the job would end GREEN having
    # reviewed nothing; on a private repo with fork runs enabled it would run
    # fork code with Bash on a fenced self-hosted runner. A skipped only-job
    # yields a `skipped` run, which the driver classifies as failed and the
    # merge gate denies — zero runner time, secret present or not.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    # A JSON ARRAY, not a bare string: `runs-on` has to be able to carry a LABEL
    # FENCE of two or more labels, and vars.RUNNER_LABEL (singular, what ci.yml
    # uses) cannot express one. fromJSON of a defaulted literal keeps the
    # expression valid JSON whether or not the variable is set.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    # TWO passes must fit. The header's "5-9 minute job" is one pass on a
    # normal diff; a first pass that walks a large diff serially (it can no
    # longer fan out) and still posts nothing, plus a retry, needs more than
    # the old 30. The action writes its transcript only when a pass ENDS, so
    # a pass killed by this timeout leaves no transcript and no gate output
    # — the budget has to cover the retry, not just start it. 60 since the
    # reviewer runs at --effort xhigh (0.37.0): measured passes took 5-9 min
    # at default effort, and xhigh can roughly double that per pass.
    timeout-minutes: 60
    env:
      # The review prompt, defined ONCE at job level so the first pass and the
      # retry pass send identical instructions (the retry adds a preamble).
      # Job-level env is the one place a multi-line string can be shared
      # between two steps without YAML anchors, which Actions does not support.
      # Nothing secret goes in this block: it is visible to every step.
      # CACHE SEARCH (0.38.0) is the one hunting angle in this prompt.
      # 0.37.0 kept angles out because a false alarm costs an e2e cycle;
      # this one was replayed first, read-only, on a consumer's merged PRs
      # at their head commits (2026-10-09, Opus 5.5, xhigh, one run each).
      # On two PRs whose audit-confirmed stale-cache defects the unchanged
      # prompt missed, it blocked both (one left erased clinical notes on
      # screen). On four PRs with no audit finding it changed no verdict:
      # approve with and without it. The wording below is the wording that
      # was replayed; reword it and that evidence no longer covers it.
      REVIEW_PROMPT: |
        Review this pull request (#${{ github.event.pull_request.number }})
        as this repository's reviewer. Read CLAUDE.md first (including the
        `## sweap config` block and standing preferences) and, if this PR's
        roadmap item carries `review-dimensions` tags, honor those too. If
        that config block declares `review.focus`, treat every item on it as
        part of the priority list below, in this repository's own
        vocabulary.
        Focus on, in priority order: correctness bugs; authorization /
        access-control bypasses (permission checks on every server entry
        point, tenant/ownership boundaries on every query); tests weakened,
        skipped, or modified to pass; CLAUDE.md / playbook convention
        violations.
        The bar is the same one the in-session reviewer uses. Every finding
        cites file:line and says what is wrong and why it matters; report
        only findings you are actually confident in. Use needs-work if there
        is even one confirmed finding that should block merge: any
        correctness bug, any access-control gap, any weakened or skipped
        test, any rationalisation for skipping review. Remarks below that
        bar (style, naming, a comment that could be clearer, a nice-to-have)
        go under a "### Advisory" heading in the summary and never change
        the verdict — write them down, do not let them decide. The
        PENULTIMATE line of the summary is exactly
        "Findings: important=N nit=M" (N = findings that meet the needs-work
        bar, M = advisory remarks); the LAST line is the verdict.
        One rule on top of that bar.
        CACHE SEARCH, every PR. For each cache key, stored column or
        other derived copy of data this PR adds or changes: grep for every
        writer and every reader. A write that changes the underlying data
        without invalidating or updating that copy is a finding.
        Do the ENTIRE review in this one turn. You are running inside a
        GitHub Action, which invokes you exactly once and never again: there
        is no later turn, no wake-up, and no background agent that can report
        back to you. Do not dispatch sub-agents, do not schedule a wake-up,
        do not end your turn to wait for anything. On a large diff, walk it
        yourself in pieces — `gh pr diff` plus per-file Read — until every
        file is covered, then post. A turn that ends before the summary
        comment is posted loses the verdict and blocks the merge.
        Post inline comments only for findings you are
        confident in. Then — REQUIRED — post ONE summary comment whose
        LAST line is exactly "Verdict: approve" or "Verdict: needs-work"
        (a downstream gate reads that line; if you post nothing the merge
        is blocked). Inline comments do NOT satisfy the gate, no matter
        how many you posted — the summary comment is a separate, always
        required step. Post it even when you found nothing at all
        (that is the "Verdict: approve" case). To post reliably: use the
        Write tool to write the full summary to /tmp/verdict.md, then run
        `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verdict.md`.
        Do NOT build the comment with shell command substitution, heredocs,
        or pipes (e.g. `--body "$(...)"`) — the sandbox denies those, which
        is why past reviews silently failed to post. Write the file, then
        post it with the --body-file form above.
        Posting the summary is the LAST thing you do and the one step that
        must not be skipped: a run that ends without it is indistinguishable
        from a reviewer that never ran, and costs a human a manual re-run.
      # Write (to stage the verdict file) + Read/Grep/Glob (inspect code) +
      # gh pr comment --body-file (post without shell substitution, the form
      # the sandbox allows). The restrictive list avoids a `--body "$(...)"`
      # post being denied — --body-file sidesteps that. The verdict gate
      # below still fails closed if nothing lands.
      # --disallowedTools is the control the allow-list is not: allowedTools
      # only auto-approves, and Agent/ScheduleWakeup never needed approval, so
      # the reviewer could fan out and end its turn to wait (consumer PR #310).
      # Task is Agent's former name; listing a name that does not exist is
      # harmless.
      # MODEL: the `opus` ALIAS, not a pinned id. The action has no `model`
      # input (v1 dropped it), so the model is a CLI flag passed through
      # claude_args. Left unset the action picks its own default, which was
      # Sonnet — a reviewer that is the last gate before merge is worth the
      # stronger model, and Opus runs adaptive thinking by default. The
      # alias outlived this file becoming managed: the sync now carries a
      # change to every consumer, but each consumer still has to COMMIT and
      # HUMAN-MERGE the resulting workflow diff, so a pinned `claude-opus-5`
      # would still buy that cycle in every repo the day Opus 5 is
      # superseded. The alias resolves inside the CLI that the action PINS
      # (the action installs a fixed CLI version per release), so it tracks
      # the latest Opus only when the action SHA below moves: on v1.0.165
      # (CLI 2.1.201) `opus` was claude-opus-4-8 for weeks after 5.5 shipped.
      # v1.0.235 installs CLI 2.1.283, where `opus` is claude-opus-5-5
      # (2.1.280) and xhigh no longer fails a turn with thinking off (2.1.283).
      # Moving to a new Opus is a SHA bump. Cost, for the record: Opus is
      # ~2.5x Sonnet per token, and a review measured ~$0.25-0.35 of
      # subscription usage on Sonnet.
      # EFFORT: --effort xhigh, a CLI flag passed through claude_args (the
      # action has no effort input). A flag, not the effortLevel setting: a
      # new model's default-effort hold ignores the setting (CLI 2.1.257).
      # The reviewer's job is to hunt, the one step sweap runs above high.
      CLAUDE_ARGS: '--model opus --effort xhigh --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)" --disallowedTools "Agent,Task,ScheduleWakeup"'
    steps:
      - name: Check for OAuth token
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set - skipping Claude review"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        id: reviewer
        if: steps.token.outputs.present == 'true'
        # continue-on-error so a first pass that CRASHES (not just one that
        # posts nothing) can still be rescued by the retry pass. The verdict
        # gate at the end is the control; this step's own exit status is not.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}
          # Inline comments post live. The action's default buffers them and
          # classifies them with Haiku after the session — but only when an
          # ANTHROPIC_API_KEY is present, which the OAuth path never sets, so
          # on our consumers the buffer just delays every inline comment to
          # job end and hides a failed post from the reviewer. Off, so the
          # reviewer sees a post fail (wrong line, not in diff) while it can
          # still act on it.
          classify_inline_comments: 'false'

      - name: Look for a verdict from the first pass
        id: first
        if: steps.token.outputs.present == 'true'
        # GH_TOKEN is STEP-scoped on purpose, here and below. At job level it
        # would reach the reviewer's own `gh` calls and outrank the token the
        # action provisions, so the verdict would post as github-actions[bot]
        # and the identity check would reject it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_LOGIN: ${{ vars.CLAUDE_REVIEWER_LOGIN || 'claude[bot]' }}
          FIRST_OUTCOME: ${{ steps.reviewer.outcome }}
        run: |
          # The action writes its transcript to ONE fixed path in RUNNER_TEMP
          # (base-action/src/execution-file.ts), so a retry pass would
          # overwrite the first pass's transcript — the one that explains why
          # a retry was needed. Move it aside first.
          if [ -f "$RUNNER_TEMP/claude-execution-output.json" ]; then
            mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/claude-execution-output.pass1.json"
          fi

          # A PR that edits the reviewer workflow makes the action self-skip (it
          # refuses to run a workflow diff not yet on the default branch), so it
          # posts no verdict. Don't retry those and don't self-block them — the
          # other gates plus a human still cover them; every other PR is
          # hard-gated below. Consequence worth knowing before you edit this
          # file: a change here CANNOT be tested by its own PR. It ships blind
          # and is proven by the next PR after the merge.
          if gh pr diff "$PR" --name-only | grep -qx ".github/workflows/claude-review.yml"; then
            echo "self_edit=true" >> "$GITHUB_OUTPUT"
            echo "verdict=" >> "$GITHUB_OUTPUT"
            echo "::notice::PR modifies the review workflow; reviewer self-skips — no retry, verdict gate not enforced on this PR."
            exit 0
          fi
          echo "self_edit=false" >> "$GITHUB_OUTPUT"

          # The verdict reader, written ONCE and run by this step and by the
          # gate at the end (after a retry may have posted). It prints the
          # verdict line, or nothing.
          #
          # The verdict is read from THREE surfaces, because the reviewer does
          # not always use the one the prompt asks for: issue comments (the
          # `gh pr comment` form the prompt prescribes), PR review bodies (what
          # the inline-comment tool submits), and inline review comments. A
          # verdict posted on any of them counts; a run that posts none still
          # fails closed. Observed 2026-08-11: a review submitted with an EMPTY
          # body plus one inline comment and no issue comment — the old
          # issue-comments-only read reported "no verdict" and blocked a PR the
          # reviewer had in fact reviewed.
          #
          # Three hardening rules ride along, because widening the search widens
          # what a stale or quoted string could do:
          #   1. Only the LAST non-empty line of a comment can carry the verdict
          #      (exactly what the prompt demands). A substring match anywhere in
          #      the body let a quoted "Verdict: approve" — e.g. a PR that edits
          #      this very file — outrank the real "Verdict: needs-work" below it,
          #      since approve was tested first.
          #   2. Only comments newer than the head commit count. Otherwise an
          #      approve from a previous push satisfies the gate for a run whose
          #      reviewer errored out and posted nothing.
          #   3. Identity is exact: login must equal the reviewer app's bot login
          #      (default claude[bot], overridable via repo variable
          #      CLAUDE_REVIEWER_LOGIN) AND user.type must be Bot. The old
          #      case-insensitive substring match accepted any human handle
          #      containing "claude" and any third-party "*claude*[bot]" app.
          #      GitHub usernames cannot contain "[" or "]", so an exact
          #      "<slug>[bot]" login cannot be produced by a user account.
          #      performed_via_github_app is deliberately NOT checked — GitHub
          #      returns it only on issue comments, not on reviews or inline
          #      review comments (observed 2026-08-25), so a gate on it would
          #      reject two of the three surfaces.
          cat > "$RUNNER_TEMP/read-verdict.sh" <<'EOF'
          #!/usr/bin/env bash
          # read-verdict.sh — prints the reviewer's verdict line (empty = none).
          # Needs: GH_TOKEN PR REPO HEAD_SHA REVIEWER_LOGIN. Exit 2 = a GitHub
          # read failed (the caller fails closed). EVERY read is checked: an
          # empty verdict must mean "the reviewer posted none", never "a 502
          # hid it" — the retry pass keys on empty, and a hidden verdict would
          # buy a second review and a duplicate comment.
          set -uo pipefail
          head_ts=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
          if [ -z "$head_ts" ]; then
            echo "::error::Could not read the head commit timestamp — failing closed." >&2
            exit 2
          fi
          rows=$(mktemp)
          read_surface() { # read_surface <api path> <jq projection>
            gh api "$1" --paginate --jq "$2" >> "$rows" || {
              echo "::error::GitHub API read failed ($1) — failing closed rather than guessing 'no verdict'." >&2
              exit 2
            }
          }
          read_surface "repos/$REPO/issues/$PR/comments" '.[] | {t: .created_at, u: .user.login, ty: .user.type, b: .body}'
          read_surface "repos/$REPO/pulls/$PR/reviews"   '.[] | {t: .submitted_at, u: .user.login, ty: .user.type, b: .body}'
          read_surface "repos/$REPO/pulls/$PR/comments"  '.[] | {t: .created_at, u: .user.login, ty: .user.type, b: .body}'
          # Input redirected FIRST so the program's closing quote ends the last
          # line: claude-review-verdict.test.sh extracts the program by that
          # shape and runs the fixtures through the text that ships.
          < "$rows" jq -rs --arg who "$REVIEWER_LOGIN" --arg since "$head_ts" '
                [ .[]
                  | select(.u == $who and .ty == "Bot")
                  | select(.t != null and .t > $since)
                  | select(.b != null and .b != "")
                  | .last = ( .b | split("\n") | map(sub("\r$"; ""))
                              | map(select(test("[^[:space:]]"))) | last // "" )
                  | select(.last | test("^[[:space:]]*\\**[[:space:]]*verdict[[:space:]]*:[[:space:]]*(approve|needs-work)[[:space:]]*\\**[[:space:]]*\\.?[[:space:]]*$"; "i"))
                ]
                | sort_by(.t) | last | if . == null then "" else .last end'
          EOF
          verdict=$(bash "$RUNNER_TEMP/read-verdict.sh") || exit 1
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ -n "$verdict" ]; then
            echo "First pass posted a verdict: $verdict"
          elif [ "$FIRST_OUTCOME" = "failure" ]; then
            echo "::warning::First pass FAILED (the action step errored) and posted no verdict — running the retry pass anyway. If it failed before reviewing (expired CLAUDE_CODE_OAUTH_TOKEN, non-human PR actor such as a bot-authored PR, missing permission), the retry will fail the same way: read the first step's log, not the transcript."
          else
            echo "::warning::First pass ended cleanly with NO verdict — running the retry pass. This is the lost-turn failure the retry exists for; the first pass's transcript is kept as claude-execution-output.pass1.json in the artifact."
          fi

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        id: retry
        # The one re-invocation the first pass may have assumed it would get.
        # Runs only when the first pass posted nothing and the PR does not edit
        # this workflow (then the action would self-skip again). Same tools,
        # same model, same prompt; the preamble says why it is running.
        # continue-on-error for the same reason as pass 1: a retry that posts
        # the verdict and THEN throws (SDK stream error, failed post-step)
        # must still reach the gate, which is the control. There is no third
        # pass: only two action steps exist in this file.
        if: steps.token.outputs.present == 'true' && steps.first.outputs.self_edit != 'true' && steps.first.outputs.verdict == ''
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            RETRY. A previous reviewer run on this pull request ended WITHOUT
            posting a summary comment, so the gate has no verdict. Nothing from
            that run survives: no notes, no sub-agents, no partial work you can
            wait for. Do the whole review again now, in this single turn, and
            post the summary comment before you stop. If inline comments from
            the earlier run are already on the PR, do not repeat them.
            ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}
          classify_inline_comments: 'false'

      - name: Upload reviewer transcript
        # DIAGNOSTIC, and the reason this file became managed. Observed
        # 2026-09-02: the reviewer finished with subtype "success" and
        # is_error false and posted NOTHING — no issue comment, no review, no
        # inline comment — three times across two consumer PRs (#236 twice, #237
        # once) and once on another consumer, and the verdict gate below correctly failed
        # closed on each. Every one of those runs was unreproducible afterwards,
        # because claude-code-action writes its transcript to the runner temp
        # and uploads nothing: four occurrences, two theories, zero diagnoses.
        # Both theories are in fact refuted — the installation-token curl that
        # "returned no bytes" is the post-run REVOKE (DELETE, 204) and is
        # byte-identical on successful runs, and the self-hosted DinD network
        # cannot be it because the other consumer's occurrence was on a GitHub-hosted runner.
        # `always()` so the transcript survives precisely the run that needs it.
        # The upload paid off on 2026-09-11: it is how consumer PR #310 failure
        # was diagnosed rather than theorised (see the header).
        # The transcript carries the PR diff and tool output, so it is as
        # sensitive as the repo — fine while these repos are private, and worth
        # re-reading before making one public.
        #
        # Two files: pass1.json is the first pass (moved aside above);
        # claude-execution-output.json exists only when the retry pass ran.
        if: always() && steps.token.outputs.present == 'true'
        # A diagnostic must never be the reason a review is red. Observed on
        # a consumer (3 of 14 red review runs, 2026-09-08): "Artifact storage
        # quota has been hit" failed THIS step after a verdict had been
        # posted, the gate step was skipped, and each hand rerun re-posted an
        # identical verdict. continue-on-error keeps the gate step running.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: reviewer-transcript-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          # if-no-files-found: warn keeps a missing file a warning rather than a
          # red job — this step must never be the reason a review fails.
          path: |
            ${{ runner.temp }}/claude-execution-output.pass1.json
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce reviewer verdict
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_LOGIN: ${{ vars.CLAUDE_REVIEWER_LOGIN || 'claude[bot]' }}
          SELF_EDIT: ${{ steps.first.outputs.self_edit }}
          FIRST_VERDICT: ${{ steps.first.outputs.verdict }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
          CLAUDE_ARGS: ${{ env.CLAUDE_ARGS }}
        run: |
          if [ "$SELF_EDIT" = "true" ]; then
            echo "::notice::PR modifies the review workflow; reviewer self-skips — verdict gate not enforced on this PR."
            exit 0
          fi
          # Re-read rather than trust the first pass's output: the retry pass
          # may have posted since.
          verdict=$(bash "$RUNNER_TEMP/read-verdict.sh") || exit 1
          if [ -z "$verdict" ]; then
            echo "::error::No verdict from reviewer '$REVIEWER_LOGIN' (user.type Bot) newer than head $HEAD_SHA after TWO passes (retry outcome: $RETRY_OUTCOME) — failing closed. Both transcripts are attached to this run as the 'reviewer-transcript-*' artifact (pass1.json = first pass); read them before theorising. Re-run the review, or investigate why neither pass posted. If the reviewer posts under a different login (custom github_token app), set repo variable CLAUDE_REVIEWER_LOGIN."
            exit 1
          fi
          # Size next to verdict, as a plain notice: one turn reviews a +11k
          # diff and a +200 diff alike, and whether that matters is a question
          # the next milestone audit can only answer if the sizes are on record.
          # A diagnostic, not a gate — nothing here changes the outcome.
          size=$(gh pr view "$PR" --repo "$REPO" --json additions,deletions,changedFiles \
            --jq '"+\(.additions) -\(.deletions) across \(.changedFiles) file(s)"' 2>/dev/null || echo "unknown")
          # The regime the verdict was produced under, so a later model or
          # effort change does not silently pool incomparable rows (the same
          # rule the audit record follows with find_effort:/refute_effort:).
          model=$(printf '%s' "$CLAUDE_ARGS" | grep -oE -- '--model [^ ]+' | cut -d' ' -f2); model=${model:-default}
          effort=$(printf '%s' "$CLAUDE_ARGS" | grep -oE -- '--effort [^ ]+' | cut -d' ' -f2); effort=${effort:-default}
          echo "::notice::review-size: $size; verdict: $verdict; model=$model effort=$effort"
          if [ -z "$FIRST_VERDICT" ]; then
            echo "::warning::The verdict came from the RETRY pass — the first pass ended without posting. This is the failure the retry exists for, not a healthy run: read claude-execution-output.pass1.json in the 'reviewer-transcript-*' artifact and see what the first pass did instead of posting."
          fi
          if printf '%s' "$verdict" | grep -qiE "needs-work"; then
            echo "::error::Reviewer verdict is needs-work — address the blocking findings and push before merge."
            exit 1
          fi
          echo "✅ Reviewer approved."
