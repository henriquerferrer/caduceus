<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caduceus</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --line: #e3e2de; --text: #1c1c1a; --muted: #77756f;
    --accent: #0b6e4f; --out: #e7f3ee; --in: #ececea; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1d1e1c; --line: #2e2f2c; --text: #ecebe7; --muted: #96948d;
      --accent: #5fc9a3; --out: #1f3a30; --in: #2a2b28; --bad: #f2867f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header input { flex: 1; max-width: 320px; margin-left: auto; }
  input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  nav { width: 280px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
    border-bottom: 1px solid var(--line); background: none; padding: 10px 16px; }
  nav button[aria-current="true"] { background: var(--out); }
  nav .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(520px, 85%); padding: 8px 12px; border-radius: 12px; background: var(--out);
    align-self: flex-end; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.inbound { background: var(--in); align-self: flex-start; }
  .meta { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .meta .failed { color: var(--bad); }
  .otp { font: 600 12px ui-monospace, monospace; color: var(--accent); border-color: var(--accent); padding: 1px 8px; }
  form { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  form input { flex: 1; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; }
  code { font: 12px ui-monospace, monospace; }
  @media (max-width: 640px) { nav { width: 120px; } }
</style>
</head>
<body>
<header>
  <h1>Caduceus</h1>
  <span id="count" style="color:var(--muted)"></span>
  <input id="search" type="search" placeholder="Search messages" aria-label="Search messages">
  <button id="clear">Clear all</button>
</header>
<main>
  <nav id="peers" aria-label="Conversations"></nav>
  <section>
    <div id="thread"></div>
    <form id="reply" hidden>
      <input id="replyBody" placeholder="Simulate a reply from this number" aria-label="Reply text" required>
      <button>Send reply</button>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let messages = [], current = null;

const peer = m => m.direction === 'inbound' ? m.from : m.to;
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};

async function load() {
  const q = $('search').value.trim();
  const res = await fetch('/api/v1/messages' + (q ? '?q=' + encodeURIComponent(q) : ''));
  messages = (await res.json()).messages;
  render();
}

function render() {
  const groups = new Map();
  for (const m of messages) {
    if (!groups.has(peer(m))) groups.set(peer(m), []);
    groups.get(peer(m)).push(m);
  }
  if (!groups.has(current)) current = groups.keys().next().value ?? null;
  $('count').textContent = messages.length ? messages.length + ' captured' : '';

  $('peers').replaceChildren(...[...groups].map(([number, list]) => {
    const b = el('button', { onclick: () => { current = number; render(); } },
      el('div', {}, number), el('div', { className: 'preview' }, list[0].body));
    b.setAttribute('aria-current', number === current);
    return b;
  }));

  const thread = $('thread');
  $('reply').hidden = !current;
  if (!current) {
    thread.replaceChildren(el('div', { className: 'empty' }, 'No messages yet. Point your SMS provider SDK at this server, or try: ',
      el('br'), el('code', {}, `curl -d '{"to":"+15551234567","body":"Your code is 482913"}' ${location.origin}/api/v1/send`)));
    return;
  }
  thread.replaceChildren(...groups.get(current).slice().reverse().map(m => {
    const meta = el('div', { className: 'meta' },
      el('span', {}, new Date(m.created_at).toLocaleTimeString()),
      el('span', { className: /failed|undelivered/.test(m.status) ? 'failed' : '' }, m.status),
      el('span', {}, `${m.provider} · ${m.encoding} · ${m.segments} segment${m.segments > 1 ? 's' : ''}`));
    if (m.direction === 'outbound' && m.from) meta.append(el('span', {}, 'from ' + m.from));
    if (m.otp) meta.append(el('button', { className: 'otp', title: 'Copy code',
      onclick: e => { navigator.clipboard?.writeText(m.otp); e.target.textContent = 'copied'; setTimeout(() => e.target.textContent = m.otp, 800); } }, m.otp));
    if (m.direction === 'outbound' && !/failed|undelivered/.test(m.status))
      meta.append(el('button', { style: 'padding:1px 8px;font-size:12px', onclick: () => setStatus(m.id, 'failed') }, 'Mark failed'));
    return el('div', { className: 'msg ' + m.direction }, m.body, meta);
  }));
  thread.scrollTop = thread.scrollHeight;
}

const setStatus = (id, status) => fetch(`/api/v1/messages/${id}/status`, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });

$('reply').onsubmit = async e => {
  e.preventDefault();
  const last = messages.find(m => peer(m) === current && m.direction === 'outbound');
  await fetch('/api/v1/inbound', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: current, to: last?.from ?? '', body: $('replyBody').value }) });
  $('replyBody').value = '';
};
$('clear').onclick = () => fetch('/api/v1/messages', { method: 'DELETE' });
$('search').oninput = load;

new EventSource('/api/v1/events').onmessage = load;
load();
</script>
</body>
</html>
